id = "werkzeug-url-quote"
package = "werkzeug"
error_class = "import_error"
error_contains = ["url_quote"]

[[replacements]]
path_glob = "src/**/*.py"
old = '''from werkzeug.urls import url_quote'''
new = '''from urllib.parse import quote'''

[[replacements]]
path_glob = "src/**/*.py"
old = '''return url_quote(value)'''
new = '''return quote(value, safe="/:!$'()*+,;")'''
