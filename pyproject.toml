[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upgradeproof"
version = "0.1.0"
description = "A harness that upgrades one Python dependency and returns a tested patch with evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "UpgradeProof contributors" }]
dependencies = []

[project.optional-dependencies]
cpu = ["llama-cpp-python"]
dev = ["pytest==8.3.5"]

[project.scripts]
upgradeproof = "upgradeproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
