name: Benchmark

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cpu_model:
        description: "Also run a local GGUF model when UPGRADEPROOF_GGUF is available"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Feasibility benchmark
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          extra=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.cpu_model }}" = "true" ]; then
            extra="--cpu"
          fi
          upgradeproof benchmark --root . --out docs $extra
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgradeproof-results
          path: |
            docs/results.json
            docs/summary.md
            docs/evidence
          if-no-files-found: warn
