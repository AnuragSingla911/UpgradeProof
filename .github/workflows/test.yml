name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JDKs
        run: sudo apt-get update && sudo apt-get install -y openjdk-11-jdk-headless openjdk-17-jdk-headless
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: pytest
